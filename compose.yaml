# Podiže bazu, primenjuje migracije (šema i početni podaci) i pokreće server.
# Iz čistog klona: kopiraj .env.example u .env, pa `docker compose up --build`.
name: svezko

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-svezko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Prvo kopiraj .env.example u .env}
      POSTGRES_DB: ${POSTGRES_DB:-svezko}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    command: ["--wait", "--no-dump-schema", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-svezko}:${POSTGRES_PASSWORD:?Prvo kopiraj .env.example u .env}@db:5432/${POSTGRES_DB:-svezko}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
    volumes:
      - ./apps/server/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-svezko}:${POSTGRES_PASSWORD:?Prvo kopiraj .env.example u .env}@db:5432/${POSTGRES_DB:-svezko}?sslmode=disable
      NOVO_PRAVILO_NAJVISE_PO_STAVCI: ${NOVO_PRAVILO_NAJVISE_PO_STAVCI:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
