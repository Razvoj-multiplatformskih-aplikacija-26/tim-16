name: server
description: Svežko HTTP server na Relic-u i PostgreSQL-u koji pokreće ista domenska pravila kao klijenti.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  contract:
    path: ../../packages/contract
  domain:
    path: ../../packages/domain
  mapping:
    path: ../../packages/mapping
  postgres: 3.5.18
  relic: 1.2.0
  dart_jsonwebtoken: 3.4.1
  hashlib: 2.4.2
  pool: 1.5.3

dev_dependencies:
  http: 1.6.0
  lints: ^6.0.0
  test: 1.31.1
